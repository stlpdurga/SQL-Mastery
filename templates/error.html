{% extends 'base.html' %}
{% block title %}{{ code }} · SQL Mastery{% endblock %}
{% block body_class %}error-page{% endblock %}
{% block body %}<main class="error-wrap"><a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='assets/sql-mastery-logo.svg') }}" alt="SQL Mastery"></a><span class="eyebrow">{{ code }} · A SMALL DETOUR</span><h1>{{ message }}</h1><a class="button button-primary" href="{{ url_for('dashboard') if session.get('user_id') else url_for('login') }}">Back to learning <span>→</span></a></main>{% endblock %}
